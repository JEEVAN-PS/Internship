<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Pricing Cards</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f5f7fa;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .container {
      display: flex;
      gap: 30px;
    }

    .card {
      background: white;
      padding: 30px;
      border-radius: 15px;
      width: 250px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      
      /* Animation */
      transition: all 0.3s ease;
    }

    .card:hover {
      transform: translateY(-10px) scale(1.05);
      box-shadow: 0 15px 35px rgba(0,0,0,0.2);
    }

    .card h2 {
      margin-bottom: 10px;
    }

    .price {
      font-size: 28px;
      margin: 15px 0;
      font-weight: bold;
    }

    ul {
      list-style: none;
      margin: 20px 0;
    }

    ul li {
      margin: 10px 0;
      color: #555;
    }

    .btn {
      padding: 10px 20px;
      border: none;
      border-radius: 20px;
      background: #007bff;
      color: white;
      cursor: pointer;
      transition: 0.3s;
    }

    .btn:hover {
      background: #0056b3;
    }

    /* Highlighted card */
    .featured {
      background: #007bff;
      color: white;
      transform: scale(1.1);
    }

    .featured .btn {
      background: white;
      color: #007bff;
    }

    .featured .btn:hover {
      background: #ddd;
    }

  </style>
</head>
<body>

<div class="container">

  <!-- Basic -->
  <div class="card">
    <h2>Basic</h2>
    <p class="price">$9/mo</p>
    <ul>
      <li>10 Projects</li>
      <li>Email Support</li>
      <li>Basic Features</li>
    </ul>
    <button class="btn">Choose Plan</button>
  </div>

  <!-- Standard (Highlighted) -->
  <div class="card featured">
    <h2>Standard</h2>
    <p class="price">$19/mo</p>
    <ul>
      <li>50 Projects</li>
      <li>Priority Support</li>
      <li>All Features</li>
    </ul>
    <button class="btn">Choose Plan</button>
  </div>

  <!-- Premium -->
  <div class="card">
    <h2>Premium</h2>
    <p class="price">$29/mo</p>
    <ul>
      <li>Unlimited Projects</li>
      <li>24/7 Support</li>
      <li>Advanced Features</li>
    </ul>
    <button class="btn">Choose Plan</button>
  </div>

</div>

</body>
</html>
